# Wrist images on RealSense are commonly best_effort. A best_effort
# subscription still receives reliable publishers, so head images stay compatible.
/camera/left_eye_resize:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera/right_eye_resize:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera/kfc_compressed:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera_l/color/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera_r/color/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera_l/depth/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/camera_r/depth/image_rect_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
